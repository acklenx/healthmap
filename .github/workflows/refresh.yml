# Weekly refresh of the inspection data.
#
# The crawler runs here rather than on Cloudflare because a full crawl is a
# couple of thousand page fetches, which does not fit inside a Worker's
# subrequest budget. GitHub Actions does it for free and commits the result.
#
# Committing *is* the deploy. The Pages project is wired to this repository
# through Cloudflare's Git integration, so the push at the end of this job is
# what publishes the new payload. Nothing here talks to Cloudflare, and no
# Cloudflare credentials are needed.
#
# Repository secrets (both optional -- only for push alerts):
#   NOTIFY_SECRET           same value set on the Pages project
#   APP_ORIGIN              https://healthmap.acklenx.com

name: Refresh inspection data

# The plan, in the run's own title. There is no API for a dispatch's inputs, so
# this is how the coverage page learns which counties a run is working on.
run-name: >-
  Refresh ${{ inputs.counties && format('· {0}', inputs.counties) || '' }}${{
  inputs.chunk && format(' · chunk {0}', inputs.chunk) || '' }}${{
  inputs.full == true && ' · full' || '' }}

on:
  schedule:
    # Weekly incremental. Nightly was ~40 new inspections on a good day across
    # 9k places and often zero; the data does not move fast enough to be worth
    # a run a day, and every run is load on a state health department's site.
    - cron: "20 8 * * 2"
    # Quarterly full crawl — corrections, closures and re-permits.
    - cron: "50 9 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      full:
        description: "Run a full crawl instead of an incremental one"
        type: boolean
        default: false
      counties:
        description: "Counties to crawl: names, or 'all' for Georgia"
        type: string
        default: ""
      chunk:
        description: "Crawl the Nth of M slices, e.g. 2/4. Splits a statewide run."
        type: string
        default: ""
      delay:
        description: "Minimum seconds between requests (default 0.5)"
        type: string
        default: ""

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A statewide full crawl is ~13k page fetches at three workers.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The crawler is deliberately stdlib-only, so there is nothing to install.

      - name: Choose crawl mode
        id: mode
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ] || [ "${{ github.event.schedule }}" = "50 9 1 1,4,7,10 *" ]; then
            echo "args=--full" >> "$GITHUB_OUTPUT"
          else
            echo "args=--since-days 45" >> "$GITHUB_OUTPUT"
          fi

      # Everything that can be known without crawling, checked first.
      #
      # A full crawl of 40 counties once ran for 27 minutes, crawled correctly,
      # and would have been discarded by a payload check that still carried a
      # metro-Atlanta bounding box. Nothing was wrong with the crawl and
      # everything was knowable in advance -- so it is known in advance now.
      - name: Preflight
        env:
          COUNTIES: ${{ github.event.inputs.counties }}
          CHUNK: ${{ github.event.inputs.chunk }}
        run: |
          set -- 
          if [ -n "$COUNTIES" ]; then set -- "$@" --counties "$COUNTIES"; fi
          if [ -n "$CHUNK" ];    then set -- "$@" --chunk "$CHUNK"; fi
          python3 scripts/preflight.py "$@"

      # The crawl is split into eight steps rather than one.
      #
      # Not for parallelism -- they run in order, and the throttle is global.
      # It is so that progress is visible: step status is the only thing about
      # a running job that an unauthenticated browser can read, and GitHub
      # allows 60 such reads an hour. One long step gives a timer counting up
      # and then, suddenly, done. Eight steps give something that moves.
      #
      # Each part publishes into the working tree; only the commit below is
      # once, so this costs nothing but the step boundaries.
      - name: "Crawl · part 1 of 8"
        env:
          COUNTIES: ${{ github.event.inputs.counties }}
          CHUNK: ${{ github.event.inputs.chunk }}
          DELAY: ${{ github.event.inputs.delay }}
        run: |
          set -- ${{ steps.mode.outputs.args }} --workers 3 --sub 1/8
          if [ -n "$COUNTIES" ]; then set -- "$@" --counties "$COUNTIES"; fi
          if [ -n "$CHUNK" ];    then set -- "$@" --chunk "$CHUNK"; fi
          if [ -n "$DELAY" ];    then set -- "$@" --delay "$DELAY"; fi
          python3 crawler/crawl.py "$@"

      - name: "Check · after part 1"
        run: python3 scripts/verify_data.py --quick

      - name: "Crawl · part 2 of 8"
        env:
          COUNTIES: ${{ github.event.inputs.counties }}
          CHUNK: ${{ github.event.inputs.chunk }}
          DELAY: ${{ github.event.inputs.delay }}
        run: |
          set -- ${{ steps.mode.outputs.args }} --workers 3 --sub 2/8
          if [ -n "$COUNTIES" ]; then set -- "$@" --counties "$COUNTIES"; fi
          if [ -n "$CHUNK" ];    then set -- "$@" --chunk "$CHUNK"; fi
          if [ -n "$DELAY" ];    then set -- "$@" --delay "$DELAY"; fi
          python3 crawler/crawl.py "$@"

      - name: "Check · after part 2"
        run: python3 scripts/verify_data.py --quick

      - name: "Crawl · part 3 of 8"
        env:
          COUNTIES: ${{ github.event.inputs.counties }}
          CHUNK: ${{ github.event.inputs.chunk }}
          DELAY: ${{ github.event.inputs.delay }}
        run: |
          set -- ${{ steps.mode.outputs.args }} --workers 3 --sub 3/8
          if [ -n "$COUNTIES" ]; then set -- "$@" --counties "$COUNTIES"; fi
          if [ -n "$CHUNK" ];    then set -- "$@" --chunk "$CHUNK"; fi
          if [ -n "$DELAY" ];    then set -- "$@" --delay "$DELAY"; fi
          python3 crawler/crawl.py "$@"

      - name: "Check · after part 3"
        run: python3 scripts/verify_data.py --quick

      - name: "Crawl · part 4 of 8"
        env:
          COUNTIES: ${{ github.event.inputs.counties }}
          CHUNK: ${{ github.event.inputs.chunk }}
          DELAY: ${{ github.event.inputs.delay }}
        run: |
          set -- ${{ steps.mode.outputs.args }} --workers 3 --sub 4/8
          if [ -n "$COUNTIES" ]; then set -- "$@" --counties "$COUNTIES"; fi
          if [ -n "$CHUNK" ];    then set -- "$@" --chunk "$CHUNK"; fi
          if [ -n "$DELAY" ];    then set -- "$@" --delay "$DELAY"; fi
          python3 crawler/crawl.py "$@"

      - name: "Check · after part 4"
        run: python3 scripts/verify_data.py --quick

      - name: "Crawl · part 5 of 8"
        env:
          COUNTIES: ${{ github.event.inputs.counties }}
          CHUNK: ${{ github.event.inputs.chunk }}
          DELAY: ${{ github.event.inputs.delay }}
        run: |
          set -- ${{ steps.mode.outputs.args }} --workers 3 --sub 5/8
          if [ -n "$COUNTIES" ]; then set -- "$@" --counties "$COUNTIES"; fi
          if [ -n "$CHUNK" ];    then set -- "$@" --chunk "$CHUNK"; fi
          if [ -n "$DELAY" ];    then set -- "$@" --delay "$DELAY"; fi
          python3 crawler/crawl.py "$@"

      - name: "Check · after part 5"
        run: python3 scripts/verify_data.py --quick

      - name: "Crawl · part 6 of 8"
        env:
          COUNTIES: ${{ github.event.inputs.counties }}
          CHUNK: ${{ github.event.inputs.chunk }}
          DELAY: ${{ github.event.inputs.delay }}
        run: |
          set -- ${{ steps.mode.outputs.args }} --workers 3 --sub 6/8
          if [ -n "$COUNTIES" ]; then set -- "$@" --counties "$COUNTIES"; fi
          if [ -n "$CHUNK" ];    then set -- "$@" --chunk "$CHUNK"; fi
          if [ -n "$DELAY" ];    then set -- "$@" --delay "$DELAY"; fi
          python3 crawler/crawl.py "$@"

      - name: "Check · after part 6"
        run: python3 scripts/verify_data.py --quick

      - name: "Crawl · part 7 of 8"
        env:
          COUNTIES: ${{ github.event.inputs.counties }}
          CHUNK: ${{ github.event.inputs.chunk }}
          DELAY: ${{ github.event.inputs.delay }}
        run: |
          set -- ${{ steps.mode.outputs.args }} --workers 3 --sub 7/8
          if [ -n "$COUNTIES" ]; then set -- "$@" --counties "$COUNTIES"; fi
          if [ -n "$CHUNK" ];    then set -- "$@" --chunk "$CHUNK"; fi
          if [ -n "$DELAY" ];    then set -- "$@" --delay "$DELAY"; fi
          python3 crawler/crawl.py "$@"

      - name: "Check · after part 7"
        run: python3 scripts/verify_data.py --quick

      - name: "Crawl · part 8 of 8"
        env:
          COUNTIES: ${{ github.event.inputs.counties }}
          CHUNK: ${{ github.event.inputs.chunk }}
          DELAY: ${{ github.event.inputs.delay }}
        run: |
          set -- ${{ steps.mode.outputs.args }} --workers 3 --sub 8/8
          if [ -n "$COUNTIES" ]; then set -- "$@" --counties "$COUNTIES"; fi
          if [ -n "$CHUNK" ];    then set -- "$@" --chunk "$CHUNK"; fi
          if [ -n "$DELAY" ];    then set -- "$@" --delay "$DELAY"; fi
          python3 crawler/crawl.py "$@"

      - name: "Check · after part 8"
        run: python3 scripts/verify_data.py --quick

      # A scrape fails quietly: upstream markup changes and the payload comes
      # back empty while everything still "succeeds". Fail the run instead of
      # deploying a broken dataset over a good one.
      # Violation counts for the newest inspection at each place, a slice at a
      # time. ~27k reports is four hours in one sitting; 1500 a run fills in
      # over a few weeks and then only new inspections cost anything.
      - name: Backfill violation counts
        run: python3 crawler/crawl.py --rebuild --reports 1500 --delay 0.5

      - name: Verify the payload
        run: python3 scripts/verify_data.py

      - name: Commit data
        run: |
          git config user.name "score-bot"
          git config user.email "score-bot@users.noreply.github.com"
          git add data/ web/public/counties.json web/public/version.json \
                  web/public/changes.json web/public/chains.json \
                  web/public/trend.json web/public/places/ web/public/history/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"

          # Rebase and retry rather than throwing the crawl away.
          #
          # A statewide crawl runs for an hour or more, and any push to main in
          # that window makes this checkout stale. The push then fails, the job
          # goes red, and everything it fetched is discarded -- which is what
          # happened the first time a full crawl overlapped a code change.
          #
          # This only ever writes generated data, and people only write source,
          # so a rebase is expected to apply cleanly. If it does not, fail
          # loudly: a conflict here means something is writing data by hand,
          # and quietly forcing over it would be the wrong answer.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto origin/main and retrying."
            git pull --rebase origin main || {
              echo "Rebase failed -- data was changed outside this job."
              exit 1
            }
            sleep 5
          done
          echo "Could not push after 3 attempts."
          exit 1

      # No deploy step. Cloudflare is watching this repository and the push
      # above has already started the build. Adding `wrangler pages deploy`
      # here would publish the same commit a second time.

      # Tell the app about new scores so it can alert anyone who saved that
      # restaurant. This only queues rows in D1 from the payload posted below,
      # so it does not matter that the new data may still be building.
      # Skipped silently when alerts aren't configured.
      - name: Send alerts
        env:
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
        run: |
          if [ -z "$NOTIFY_SECRET" ] || [ -z "$APP_ORIGIN" ]; then
            echo "Alerts not configured; skipping."
            exit 0
          fi
          COUNT=$(python3 -c "import json;print(len(json.load(open('data/changes.json'))['changes']))")
          echo "$COUNT new inspections"
          if [ "$COUNT" != "0" ]; then
            python3 -c "import json;print(json.dumps({'changes':json.load(open('data/changes.json'))['changes']}))" > /tmp/notify.json
            curl -sS -X POST "$APP_ORIGIN/api/notify" \
              -H "Authorization: Bearer $NOTIFY_SECRET" \
              -H "Content-Type: application/json" \
              --data @/tmp/notify.json
          fi

      # Deliberately last. verify_data.py measures the *aggregate* share of
      # placed addresses, which the geocode cache dominates, so a total Census
      # outage passes every check it makes while new establishments quietly
      # stop getting coordinates. This asks five addresses with known answers.
      #
      # It runs after the commit and the deploy on purpose: a sick geocoder is
      # worth going red over, but it is not a reason to withhold a good set of
      # inspection scores that has already been crawled and verified.
      - name: Geocoder health check
        run: python3 scripts/check_geocoder.py
