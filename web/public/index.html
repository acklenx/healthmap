<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Score — restaurant health inspections near you</title>
<meta name="description" content="Georgia health department inspection scores for restaurants near you, in Cobb, Cherokee and Fulton counties.">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Score">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/styles.css">
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <h1>Score</h1>
    <button id="locate" class="locate" type="button" aria-label="Use my location">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/>
        <path d="M12 1.6v3M12 19.4v3M1.6 12h3M19.4 12h3"/>
      </svg>
      <span id="locate-label">Locate me</span>
    </button>
  </div>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8 21 21"/>
    </svg>
    <input id="search" type="search" placeholder="Search a restaurant" autocomplete="off"
           spellcheck="false" enterkeyhint="search" aria-label="Search restaurants by name">
  </div>

  <div class="chips" role="group" aria-label="Filter">
    <button class="chip is-on" data-filter="all" type="button">All</button>
    <button class="chip" data-filter="fav" type="button">
      <svg class="chip-star" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="m12 3.6 2.6 5.3 5.8.85-4.2 4.1 1 5.75L12 16.9l-5.2 2.7 1-5.75-4.2-4.1 5.8-.85Z"/>
      </svg>Saved</button>
    <button class="chip" data-filter="A" type="button">A only</button>
    <button class="chip" data-filter="bad" type="button">B or worse</button>
    <span class="chips-sep" aria-hidden="true"></span>
    <button class="chip" data-sort="dist" type="button">Nearest</button>
    <button class="chip" data-sort="recent" type="button">Newest</button>
    <button class="chip" data-sort="worst" type="button">Lowest</button>
  </div>
</header>

<main class="panes">
  <div class="pane-list" id="pane-list">
    <p id="status" class="status" role="status" aria-live="polite">Loading inspections…</p>
    <ol id="list" class="list"></ol>
    <div id="sentinel" class="sentinel" aria-hidden="true"></div>
    <p id="empty" class="empty" hidden></p>
  </div>

  <!-- The map is built on demand: Leaflet is only fetched the first time this
       pane is shown, so the list-only launch stays as cheap as it ever was. -->
  <div class="pane-map" id="pane-map">
    <div id="map" class="map" role="application"
         aria-label="Map of restaurants, with your home as a draggable pin"></div>

    <!-- Pan the map until the crosshair is where you want home to be. The
         crosshair is decoration; the button underneath carries the action. -->
    <div id="crosshair" class="crosshair" aria-hidden="true">
      <svg viewBox="0 0 40 40" focusable="false">
        <circle cx="20" cy="20" r="10.5"/>
        <path d="M20 2.5v9M20 28.5v9M2.5 20h9M28.5 20h9"/>
        <circle cx="20" cy="20" r="1.6" class="crosshair-dot"/>
      </svg>
    </div>

    <button id="sethome" class="sethome" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M3.6 10.4 12 3.6l8.4 6.8"/><path d="M5.8 12.2V20h12.4v-7.8"/>
      </svg>
      Save this as home
    </button>

    <p id="map-note" class="map-note" role="status" aria-live="polite" hidden></p>
  </div>
</main>

<button id="viewtoggle" class="viewfab" type="button" aria-pressed="false">
  <svg class="fab-map" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M9 3.6 3 6v14.4l6-2.4 6 2.4 6-2.4V3.6l-6 2.4Z"/><path d="M9 3.6v14.4M15 6v14.4"/>
  </svg>
  <svg class="fab-list" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M4 6.5h16M4 12h16M4 17.5h16"/>
  </svg>
  <span id="viewtoggle-label">Map</span>
</button>

<footer class="foot">
  <p>Data from the <a href="https://ga.healthinspections.us/georgia/" rel="noopener">Georgia Department of Public Health</a>.
     Scores are a snapshot of one visit, not a running verdict.</p>
  <p id="freshness" class="freshness"></p>
</footer>

<!-- Detail sheet -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-scrim" data-close></div>
  <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-name">
    <div class="sheet-grab" data-close></div>
    <div class="sheet-head">
      <div>
        <h2 id="sheet-name"></h2>
        <a id="sheet-addr" class="sheet-addr" target="_blank" rel="noopener"></a>
      </div>
      <button id="sheet-close" class="icon-btn" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-actions">
      <button id="fav-btn" class="action" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="m12 3.6 2.6 5.3 5.8.85-4.2 4.1 1 5.75L12 16.9l-5.2 2.7 1-5.75-4.2-4.1 5.8-.85Z"/>
        </svg><span id="fav-label">Save</span>
      </button>
      <a id="dir-btn" class="action" href="#" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/>
        </svg>Directions
      </a>
    </div>
    <div class="sheet-body">
      <!-- The tap target overlays the map rather than wrapping it: Leaflet
           injects the OpenStreetMap attribution link into the canvas, and an
           anchor inside an anchor is invalid. The overlay stops short of the
           bottom strip so that credit stays clickable. -->
      <div id="sheet-map" class="sheet-map" hidden>
        <span id="sheet-map-canvas" class="sheet-map-canvas" aria-hidden="true"></span>
        <a id="sheet-map-link" class="sheet-map-hit" target="_blank" rel="noopener">
          <span id="sheet-map-tag" class="sheet-map-tag"></span>
        </a>
      </div>
      <div id="sheet-body" class="sheet-sections"></div>
    </div>
  </section>
</div>

<!-- Location picker: for when the device won't or can't supply a position -->
<div id="locsheet" class="sheet" hidden>
  <div class="sheet-scrim" data-close></div>
  <section class="sheet-panel sheet-compact" role="dialog" aria-modal="true" aria-labelledby="loc-title">
    <div class="sheet-grab" data-close></div>
    <div class="sheet-head">
      <div>
        <h2 id="loc-title">Your location</h2>
        <p id="loc-current" class="sheet-addr"></p>
      </div>
      <button id="loc-close" class="icon-btn" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <button id="loc-gps" class="action wide" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/>
          <path d="M12 1.6v3M12 19.4v3M1.6 12h3M19.4 12h3"/>
        </svg>Use my current location
      </button>
      <p class="loc-or"><span>or type it in</span></p>
      <form id="loc-form" class="loc-form">
        <input id="loc-input" type="text" inputmode="text" autocomplete="postal-code"
               placeholder="ZIP code, city, or address" aria-label="ZIP code, city, or address"
               enterkeyhint="done" spellcheck="false">
        <button class="action" type="submit">Set</button>
      </form>
      <p id="loc-msg" class="loc-msg"></p>
    </div>
  </section>
</div>

<script src="/app.js" type="module"></script>
</body>
</html>
